<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040A16"/>
      <stop offset="50%" stop-color="#081427"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#F6E27A"/>
    </linearGradient>
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep background circle with subtle border -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Orbital Neon Rings -->
  <ellipse cx="50" cy="50" rx="42" ry="20" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="8 4" opacity="0.8" transform="rotate(-28 50 50)" filter="url(#glow)"/>
  <ellipse cx="50" cy="50" rx="38" ry="16" stroke="#F6E27A" stroke-width="1.2" opacity="0.6" transform="rotate(32 50 50)"/>
  
  <!-- Outer glowing rim -->
  <circle cx="50" cy="50" r="46" stroke="url(#orbGrad)" stroke-width="1.5" opacity="0.85"/>

  <!-- Central Emblem: Stylized B -->
  <path d="M36 28 H54 C61 28 66 32 66 38.5 C66 43 63 46.5 59 48 C64.5 49.5 68 53.5 68 59.5 C68 67 62 72 53.5 72 H36 V28 Z M45 44 H52.5 C55.5 44 57.5 42 57.5 39 C57.5 36 55.5 34 52.5 34 H45 V44 Z M45 66 H53.5 C57 66 59.5 63.8 59.5 60 C59.5 56.2 57 54 53.5 54 H45 V66 Z" fill="url(#bGrad)" filter="url(#glow)"/>

  <!-- Digital Core Node -->
  <circle cx="68" cy="38" r="2.5" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="32" cy="62" r="2" fill="#F6E27A"/>
</svg>
