  <!-- Costa Furtune Interaction & Conversion Measurement Engine -->
  <script>
  (function() {
    function trackEvent(name, params) {
      if (typeof gtag === 'function') {
        gtag('event', name, params);
      }
    }

    // 1. Global Link & Button Click Measurement
    document.addEventListener('click', function(e) {
      var link = e.target.closest('a, button');
      if (!link) return;

      var href = (link.getAttribute('href') || '').trim();
      var text = (link.innerText || link.getAttribute('aria-label') || link.title || '').trim().substring(0, 80);

      // WhatsApp Clicks
      if (href.includes('wa.me') || href.includes('whatsapp.com')) {
        trackEvent('contact_whatsapp', {
          event_category: 'contact',
          event_label: text || 'WhatsApp Chat',
          link_url: href
        });
      }
      // Phone Call Clicks
      else if (href.startsWith('tel:')) {
        trackEvent('contact_call', {
          event_category: 'contact',
          event_label: text || href,
          phone_number: href.replace('tel:', '')
        });
      }
      // File / Brochure / CAD Downloads
      else if (href.match(/\.(pdf|dwg|dxf|zip|xlsx?)$/i) || link.hasAttribute('download')) {
        trackEvent('file_download', {
          event_category: 'engagement',
          event_label: text || href,
          file_name: href.split('/').pop()
        });
      }
      // Drone Cinema & Virtual Tours
      else if (link.classList.contains('drone-card') || link.classList.contains('btn-cinema') || text.toLowerCase().includes('drone') || text.toLowerCase().includes('virtual tour')) {
        trackEvent('view_virtual_tour', {
          event_category: 'engagement',
          event_label: text
        });
      }
      // VIP Site Visit / Booking CTAs
      else if (text.toLowerCase().includes('site visit') || text.toLowerCase().includes('book') || text.toLowerCase().includes('schedule')) {
        trackEvent('cta_click', {
          event_category: 'conversion_intent',
          event_label: text,
          link_url: href
        });
      }
    }, true);

    // 2. Global Form Submission Measurement
    document.addEventListener('submit', function(e) {
      var form = e.target;
      var formId = form.id || 'unnamed_form';
      var formName = form.getAttribute('name') || form.className || formId;

      trackEvent('generate_lead', {
        event_category: 'lead_generation',
        form_id: formId,
        form_name: formName,
        page_location: window.location.href
      });
    }, true);
  })();
  </script>
